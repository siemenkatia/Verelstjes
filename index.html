<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verelstjes</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
@media(min-width:700px){
#app.wide{max-width:1200px}
#app.wide .cal{gap:8px}
#app.wide .dn{font-size:16px}
#app.wide .day{min-height:clamp(96px,15vh,170px);font-size:18px;padding:8px;border-radius:14px}
#app.wide .sy{display:flex;flex-wrap:wrap;gap:4px;font-size:30px;line-height:1.1}
}
 <style>
:root{--bg:#eef4fb;--card:#fff;--ink:#17324d;--mute:#5d7188;--line:#d5e1ee;--acc:#f2b632;--accink:#4a3300;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c2b;--card:#182a3f;--ink:#e8f0f8;--mute:#9db0c4;--line:#2b4260;--bad:#ff8a7a}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Nunito,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:8px 0 14px}h2{font-size:19px;font-weight:800;margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:9px 14px;background:var(--acc);color:var(--accink);font-weight:800}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.sm{padding:4px 11px;border-radius:10px}
.big{flex:1;padding:16px;font-size:20px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.prof{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 8px 12px;text-align:center;font-weight:800;font-size:18px}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:36px;color:#fff;font-weight:800}
.lock{position:absolute;top:8px;right:10px;font-size:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:13px;color:var(--mute);font-weight:700}
.day{min-height:62px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px;text-align:left;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.day.today{border-color:var(--acc)}.day.empty{visibility:hidden}.sy{font-size:15px;line-height:1.1;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;margin:3px 4px 3px 0;font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.pin{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:12px 0}
.pin button{height:64px;font-size:24px;font-weight:800;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.dots{text-align:center;font-size:30px;letter-spacing:10px;min-height:42px}
input[type=text],input[type=date],select{font:inherit;padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between;margin:6px 0}
.mute{color:var(--mute)}.warn{color:var(--bad);font-weight:800}.who{font-weight:800}
.q{min-width:28px;text-align:center;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.tile{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:8px;font-weight:800;font-size:18px;text-align:center}
.tile.on{border-color:var(--acc)}.tile.dis{opacity:.35;pointer-events:none}
.ph{border-radius:12px;display:grid;place-items:center;background:var(--bg);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.tile .ph{aspect-ratio:1;font-size:64px;margin-bottom:6px}
.mini{position:relative;display:inline-block;width:76px;margin:6px;text-align:center;font-size:12px;font-weight:700;vertical-align:top}
.mini .ph{width:76px;height:76px;font-size:36px}
.mini button{position:absolute;top:-8px;right:-8px;border-radius:50%;width:28px;height:28px;padding:0;border:0;background:var(--bad);color:#fff;font-weight:800}
.it{width:100%;margin:4px 0;padding:12px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:18px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.it.done{opacity:.55;text-decoration:line-through}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://vuotbihzgvhlanlwdtle.supabase.co',SB_KEY='sb_publishable_pWXc0TpXdLwZKGnrU1dhFw_qzmGP4OV';
const sb=supabase.createClient(SB_URL,SB_KEY);
const FAM=[{id:'lina',n:'Lina',c:'#e0679b',kid:1},{id:'lois',n:'Loïs',c:'#3d9be0',kid:1},{id:'lenn',n:'Lenn',c:'#2f9e6e',kid:1},{id:'mammie',n:'Mammie',c:'#8c5fd1'},{id:'pappie',n:'Pappie',c:'#e07a3d'}];
const KIDS=['lina','lois','lenn'],SC=['fruit','dessert','koek','sap'],TT={h:'Hartig',z:'Zoet'};
const CATS={brood:'Boterhammen',fruit:'Fruit',dessert:'Dessertjes',koek:'Koeken',sap:'Sapjes'};
const ICON={brood:'🥪',bel:'🧀',fruit:'🍎',dessert:'🍮',koek:'🍪',sap:'🧃',doos:'📦'};
const FREE={type:'free',hartig:99,zoet:99,fruit:99,dessert:99,koek:99,sap:99};
const CFG=['type','hartig','zoet','fruit','dessert','koek','sap'];
const TBL={inv:'artikelen',bel:'beleg',doz:'dozen',sym:'symbolen'};
const NONE={naam:'',antwoorden:[],antwoord_fotos:{},aantal:0};
let DB={art:[],bel:[],doz:[],sym:[],ds:[],dagen:{},week:{},keuzes:[],taken:[],klaar:[],shop:[]};
const S={scr:'home',who:null,pin:'',code:'',m:new Date(),day:null,edit:0,step:0,pend:null,ed:null,cf:null,toast:null,err:null,loading:1};
const P=id=>FAM.find(f=>f.id==id),adm=()=>!!S.who&&!P(S.who).kid;
const A=id=>DB.art.find(x=>x.id==id)||NONE,BL=id=>DB.bel.find(x=>x.id==id)||NONE,DZ=id=>DB.doz.find(x=>x.id==id)||NONE;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const dow=k=>new Date(k+'T12:00:00').getDay();
const nlDate=(k,o)=>new Date(k+'T12:00:00').toLocaleDateString('nl-BE',o);
const gv=id=>{const e=document.getElementById(id);if(!e)return'';const v=e.value.trim();e.value='';return v};
const B=(t,f,c)=>`<button class="btn ${c||''}" onclick="${f}">${t}</button>`;
const stp=(f,v)=>`<span class="row">${B('−',f+'-1)','ghost sm')}<span class="q">${v}</span>${B('+',f+'1)','sm')}</span>`;
const pick_=o=>({...o});
/* ---------- data ---------- */
async function ok(p){const r=await p;if(r.error)throw r.error;return r.data}
const upd=(t,m,v)=>ok(sb.from(t).update(v).match(m));
const ins=(t,v)=>ok(sb.from(t).insert(v));
const del=(t,m)=>ok(sb.from(t).delete().match(m));
async function load(){try{
 const d=new Date();d.setDate(d.getDate()-90);const since=key(d.getFullYear(),d.getMonth(),d.getDate()),q=t=>sb.from(t).select('*');
 const R=await Promise.all([q('artikelen').order('id'),q('beleg').order('id'),q('dozen').order('id'),q('symbolen').order('id'),q('dag_symbolen').gte('dag',since),q('dagen').gte('dag',since),q('weekstandaard'),q('keuzes').gte('dag',since).order('id'),q('taken').gte('dag',since).order('id'),q('taken_klaar'),q('boodschappen').order('id')]);
 R.forEach(r=>{if(r.error)throw r.error});const wr=await sb.from('weerplaatsen').select('*').gte('tot',since);WP=wr.error?[]:wr.data;const[a,b,c,s,ds,dg,w,k,t,kl,sh]=R.map(r=>r.data);
 DB={art:a,bel:b,doz:c,sym:s,ds,dagen:Object.fromEntries(dg.map(x=>[x.dag,x])),week:Object.fromEntries(w.map(x=>[x.weekdag,x])),keuzes:k,taken:t,klaar:kl,shop:sh};S.err=null}
 catch(e){console.error(e);S.err='Geen verbinding met de database.'}
 S.loading=0;draw()}
async function act(fn){try{await fn()}catch(e){console.error(e);toast(e.message=='OP'?'Helaas, dit is net op.':e.message=='DOOS_BEZET'?'Deze koekendoos is al gekozen.':'Er ging iets mis. Probeer opnieuw.')}await load()}
function toast(m){S.toast=m;draw();setTimeout(()=>{S.toast=null;draw()},2500)}
let T0;sb.channel('verelstjes').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(T0);T0=setTimeout(load,400)}).subscribe();
/* ---------- keuzes ---------- */
const pk=(k,w)=>DB.keuzes.filter(x=>x.dag==k&&x.persoon==w);
const typeOf=p=>p.soort=='bel'?BL(p.beleg_id).soort:A(p.artikel_id).soort;
const used=(k,w,t)=>pk(k,w).filter(p=>(p.soort=='brood'||p.soort=='bel')&&typeOf(p)==t).length;
const cnt=(k,w,c)=>pk(k,w).filter(p=>p.soort==c).length;
const dozLeft=(k,d)=>d.aantal-DB.keuzes.filter(x=>x.dag==k&&x.doos_id==d.id).length;
const cfgOf=k=>adm()?FREE:DB.dagen[k];
const lim=(g,t)=>g[t=='h'?'hartig':'zoet'];
function allowed(c,o){const k=S.day,g=cfgOf(k);return c=='brood'||c=='bel'?used(k,S.who,o.soort)<lim(g,o.soort):cnt(k,S.who,c)<g[c]}
async function pick(c,id){const o=c=='bel'?BL(id):A(id);if(!allowed(c,o))return;
 if(c=='fruit'&&o.vraag&&o.antwoorden.length){S.pend={id};draw();return}
 await choose(c,id,null)}
async function choose(c,id,ans){S.pend=null;await act(()=>c=='bel'?ok(sb.rpc('kies_beleg',{p_dag:S.day,p_persoon:S.who,p_beleg:id})):ok(sb.rpc('kies_item',{p_dag:S.day,p_persoon:S.who,p_soort:c,p_artikel:id,p_antwoord:ans})))}
const rm=id=>act(()=>ok(sb.rpc('wis_keuze',{p_id:id})));
const setD=(kid,d)=>act(()=>ok(sb.rpc('kies_doos',{p_keuze:kid,p_doos:d})));
const lab=p=>(p.soort=='bel'?BL(p.beleg_id).naam:A(p.artikel_id).naam)+(p.antwoord?' ('+p.antwoord+')':'')+(p.doos_id?' in '+DZ(p.doos_id).naam:'');
/* ---------- beheer: dag ---------- */
function ask(k,cs,fn){const n=DB.keuzes.filter(x=>x.dag==k&&cs.includes(x.soort)&&KIDS.includes(x.persoon)).length;if(!n)return act(fn);S.cf={k,cs,fn};draw()}
async function cfOk(){const c=S.cf;S.cf=null;await act(async()=>{await ok(sb.rpc('reset_keuzes',{p_dag:c.k,p_soorten:c.cs}));await c.fn()})}
const pickCfg=o=>Object.fromEntries(CFG.filter(f=>o&&f in o).map(f=>[f,o[f]]));
const setDay=()=>act(()=>ins('dagen',{dag:S.day,...pickCfg(DB.week[dow(S.day)])}));
function setT(t){const k=S.day;if(DB.dagen[k].type!=t)ask(k,['brood','bel'],()=>upd('dagen',{dag:k},{type:t}))}
function chg(f,d){const k=S.day,g=DB.dagen[k];if(g[f]+d<0)return;ask(k,f=='hartig'||f=='zoet'?['brood','bel']:[f],()=>upd('dagen',{dag:k},{[f]:g[f]+d}))}
const stdWeek=()=>act(async()=>{await ok(sb.from('weekstandaard').upsert({weekdag:dow(S.day),...pickCfg(DB.dagen[S.day])}));toast('Opgeslagen als standaard voor elke '+nlDate(S.day,{weekday:'long'})+'.')});
function applyWeek(){const y=S.m.getFullYear(),m=S.m.getMonth(),rows=[];for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=key(y,m,d);if(!DB.dagen[k]&&DB.week[dow(k)])rows.push({dag:k,...pickCfg(DB.week[dow(k)])})}
 act(async()=>{if(rows.length)await ok(sb.from('dagen').upsert(rows,{onConflict:'dag',ignoreDuplicates:true}));toast(rows.length+' dagen ingesteld.')})}
const tog=i=>act(()=>DB.ds.some(x=>x.dag==S.day&&x.symbool_id==i)?del('dag_symbolen',{dag:S.day,symbool_id:i}):ins('dag_symbolen',{dag:S.day,symbool_id:i}));
function addSym(){const e=gv('ne'),n=gv('nn');if(n)act(()=>ins('symbolen',{naam:n,emoji:e||'🔖'}))}
function addTask(){const t=gv('nt');if(t)act(()=>ins('taken',{dag:S.day,tekst:t}))}
const delT=id=>act(()=>del('taken',{id}));
const doneT=id=>act(()=>DB.klaar.some(x=>x.taak_id==id&&x.persoon==S.who)?del('taken_klaar',{taak_id:id,persoon:S.who}):ins('taken_klaar',{taak_id:id,persoon:S.who}));
/* ---------- boodschappen ---------- */
function addShop(){const t=gv('ns');if(t)act(()=>ins('boodschappen',{persoon:S.who,tekst:t}))}
const delShop=id=>act(()=>del('boodschappen',{id,persoon:S.who,in_kar:false}));
const tapShop=id=>{const x=DB.shop.find(y=>y.id==id);if(x)act(()=>x.in_kar?del('boodschappen',{id}):upd('boodschappen',{id},{in_kar:true}))};
/* ---------- beheer: voorraad ---------- */
const qq=(id,d)=>act(()=>upd('artikelen',{id},{aantal:Math.max(0,A(id).aantal+d)}));
const dd=(id,d)=>act(()=>upd('dozen',{id},{aantal:Math.max(1,DZ(id).aantal+d)}));
const bOn=id=>act(()=>upd('beleg',{id},{aanwezig:!BL(id).aanwezig}));
const flip=(t,id)=>act(()=>upd(TBL[t],{id},{soort:(t=='inv'?A(id):BL(id)).soort=='h'?'z':'h'}));
function addInv(){const n=gv('in'),c=document.getElementById('ic').value,t=document.getElementById('it').value,q=gv('iq'),a=gv('io').split(',').map(s=>s.trim()).filter(Boolean);
 if(n)act(()=>ins('artikelen',{cat:c,naam:n,soort:c=='brood'?t:null,vraag:c=='fruit'&&q&&a.length?q:null,antwoorden:c=='fruit'&&q?a:[]}))}
function addBel(){const n=gv('bn');if(n)act(()=>ins('beleg',{naam:n,soort:document.getElementById('bt').value}))}
function addDoz(){const n=gv('dn');if(n)act(()=>ins('dozen',{naam:n}))}
const ed=(kind,id)=>{S.ed={kind,id,del:0};draw()};
const edObj=e=>e.kind=='inv'?A(e.id):e.kind=='bel'?BL(e.id):e.kind=='doz'?DZ(e.id):DB.sym.find(x=>x.id==e.id)||NONE;
async function edSave(){const e=S.ed,o=edObj(e),n=gv('en');if(!n)return;const v={naam:n};
 if(e.kind=='sym')v.emoji=gv('ee')||o.emoji;
 const s=document.getElementById('et');if(s)v.soort=s.value;
 if(document.getElementById('eq')){const q=gv('eq'),a=gv('eo').split(',').map(x=>x.trim()).filter(Boolean),okq=q&&a.length;v.vraag=okq?q:null;v.antwoorden=okq?a:[]}
 S.ed=null;await act(()=>upd(TBL[e.kind],{id:e.id},v))}
async function edDel(){const e=S.ed;S.ed=null;await act(()=>del(TBL[e.kind],{id:e.id}))}
async function setPin(){const p=gv('np');if(!/^\d{4}$/.test(p)){toast('De code moet uit 4 cijfers bestaan.');return}
 try{const r=await ok(sb.rpc('wijzig_code',{p_oud:S.code,p_nieuw:p}));if(r){S.code=p;toast('Code gewijzigd.')}else toast('Code niet gewijzigd.')}catch(e){toast('Er ging iets mis.')}}
/* ---------- navigatie ---------- */
function go(s){S.scr=s;S.edit=0;S.pend=null;S.cf=null;S.ed=null;draw()}
const pickWho=id=>{S.who=id;S.pin='';go(adm()?'pin':'cal')};
const logout=()=>{S.who=null;S.code='';go('home')};
async function num(d){if(d=='<')S.pin=S.pin.slice(0,-1);else S.pin+=d;
 if(S.pin.length==4){const p=S.pin;S.pin='';draw();try{const r=await ok(sb.rpc('controleer_code',{p}));if(r===true){S.code=p;go('cal')}else toast('Foute code, probeer opnieuw.')}catch(e){toast('Geen verbinding met de database.')}return}
 draw()}
const mv=n=>{S.m=new Date(S.m.getFullYear(),S.m.getMonth()+n,1);draw()};
const opn=k=>{S.day=k;go('day')};
/* ---------- weergave ---------- */
const av=f=>`<div class="av" style="background:${f.c}">${f.n[0]}</div>`;
const ph=(o,c)=>`<div class="ph">${o.foto?`<img src="${esc(o.foto)}" alt="">`:ICON[c]}</div>`;
const si=s=>s.foto?`<img src="${esc(s.foto)}" alt="" style="width:1.4em;height:1.4em;border-radius:4px;object-fit:cover;vertical-align:middle">`:esc(s.emoji);
function head(t,back){const nav=adm()?`<div class="row" style="margin-bottom:10px;flex-wrap:wrap">${B('Kalender',"go('cal')",S.scr=='cal'?'':'ghost')}${B('Voorraad',"go('inv')",S.scr=='inv'?'':'ghost')}${B('Boodschappen',"go('shop')",S.scr=='shop'?'':'ghost')}</div>`:'';
 return `<div class="top">${back?B('‹ Terug',`go('${back}')`,'ghost'):'<span></span>'}${B('Andere persoon','logout()','ghost')}</div>${nav}${t?`<h1>${t}</h1>`:''}`}
function home(){return `<h1>Verelstjes</h1><h2>Wie ben jij?</h2><div class="grid">${FAM.map(f=>`<button class="prof" onclick="pickWho('${f.id}')">${f.kid?'':'<span class="lock">🔒</span>'}${av(f)}${f.n}</button>`).join('')}</div>`}
function pinS(){const f=P(S.who);return `<div class="top">${B('‹ Terug',"go('home')",'ghost')}</div><div style="text-align:center">${av(f)}<h2>Hallo ${f.n}</h2><div class="mute">Geef je code van 4 cijfers in</div></div><div class="dots">${[0,1,2,3].map(i=>i<S.pin.length?'●':'○').join('')}</div><div class="pin">${['1','2','3','4','5','6','7','8','9','','0','<'].map(x=>x?`<button onclick="num('${x}')">${x=='<'?'⌫':x}</button>`:'<span></span>').join('')}</div>`}
const low=()=>DB.art.filter(x=>x.aantal<=2).map(x=>x.naam+' ('+x.aantal+')');
function cal(){const y=S.m.getFullYear(),m=S.m.getMonth(),t=new Date(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=head('')+(adm()?(low().length?`<div class="card warn">Bijna op: ${esc(low().join(', '))}</div>`:'')+`<div style="margin-bottom:10px">${B('Standaardweek toepassen op deze maand','applyWeek()','ghost sm')}</div>`:'');
 h+=`<div class="top">${B('‹','mv(-1)')}<h2 style="margin:0;text-transform:capitalize">${new Date(y,m,1).toLocaleDateString('nl-BE',{month:'long',year:'numeric'})}</h2>${B('›','mv(1)')}</div><div class="cal">`;
 ['ma','di','wo','do','vr','za','zo'].forEach(d=>h+=`<div class="dn">${d}</div>`);
 for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
 for(let d=1;d<=n;d++){const k=key(y,m,d),sy=DB.ds.filter(x=>x.dag==k).map(x=>{const s=DB.sym.find(z=>z.id==x.symbool_id);return s?si(s):''}).join('');
  h+=`<button class="day${t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?' today':''}" onclick="opn('${k}')">${d}${adm()&&DB.dagen[k]?' ·':''}<span class="sy">${sy}</span></button>`}
 return h+'</div>'}
const tile=(o,c,dis)=>`<button class="tile${dis?' dis':''}" onclick="pick('${c}',${o.id})">${ph(o,c)}${esc(o.naam)}</button>`;
function minis(k,cs,ro,who){return pk(k,who||S.who).map(p=>{if(!cs.includes(p.soort))return'';const o=p.soort=='bel'?BL(p.beleg_id):A(p.artikel_id),af=p.antwoord&&o.antwoord_fotos&&o.antwoord_fotos[p.antwoord];
 return `<span class="mini">${ph(af?{foto:af}:o,p.soort)}${esc(o.naam)}${p.antwoord?'<br>'+esc(p.antwoord):''}${p.doos_id?'<br>'+esc(DZ(p.doos_id).naam):''}${ro?'':`<button onclick="rm(${p.id})" aria-label="Verwijder">✕</button>`}</span>`}).join('')}
const ALL=[...Object.keys(CATS),'bel'];
const mine=(k,w)=>{const L=pk(k,w);return L.length?L.map(p=>`<span class="chip">${esc(lab(p))}</span>`).join(''):'<span class="mute">Nog niets gekozen.</span>'};
function steps(k){const g=cfgOf(k),s=[];if(g.hartig+g.zoet>0)s.push('brood');if(g.dessert)s.push('dessert');if(g.koek){s.push('koek');if(cnt(k,S.who,'koek'))s.push('doos')}if(g.fruit)s.push('fruit');if(g.sap)s.push('sap');return s}
function wiz(k){const g=cfgOf(k),w=S.who,st=steps(k),i=S.step,c=st[i],TI={brood:g.type=='s'?'Sandwich':'Boterhammen',dessert:'Dessertje',koek:'Koek',doos:'Koekendoos',fruit:'Fruit',sap:'Sapje'};
 let h=`<div class="top">${B('‹ Stoppen','S.edit=0;draw()','ghost')}<span class="mute">${c?`${i+1} / ${st.length}`:''}</span></div>`;
 if(!c)return h+`<div class="card"><h1>${st.length?'Klaar! 🎉':'Niets te kiezen'}</h1>${minis(k,ALL,1)}</div>`+B('Sluiten','S.edit=0;draw()','big');
 h+=`<h1>${ICON[c=='brood'&&g.type=='s'?'bel':c]} ${TI[c]}</h1>`;
 if(S.pend){const o=A(S.pend.id);return h+`<div class="card"><h2>${esc(o.naam)}: ${esc(o.vraag)}</h2><div class="tiles">${o.antwoorden.map(a=>`<button class="tile" onclick="choose('fruit',${o.id},this.dataset.a)" data-a="${esc(a)}">${ph({foto:(o.antwoord_fotos||{})[a]},'fruit')}${esc(a)}</button>`).join('')}</div></div>`+B('Annuleer','S.pend=null;draw()','ghost big')}
 if(c=='doos'){pk(k,w).filter(p=>p.soort=='koek').forEach(p=>{h+=`<div class="card"><div class="who">${esc(A(p.artikel_id).naam)}</div><div class="tiles">${DB.doz.filter(d=>d.id==p.doos_id||dozLeft(k,d)>0).map(d=>`<button class="tile${p.doos_id==d.id?' on':''}" onclick="setD(${p.id},${d.id})">${ph(d,'doos')}${esc(d.naam)}</button>`).join('')}</div></div>`})}
 else{h+=`<div class="card">${minis(k,c=='brood'?['brood','bel']:[c])||'<span class="mute">Tik op een foto om te kiezen.</span>'}</div>`;
  if(c=='brood')['h','z'].forEach(t=>{if(!lim(g,t))return;const full=used(k,w,t)>=lim(g,t);
   const a=g.type!='s'?DB.art.filter(x=>x.cat=='brood'&&x.soort==t&&x.aantal>0).map(x=>tile(x,'brood',full)):[];
   const b=g.type!='b'?DB.bel.filter(x=>x.soort==t&&x.aanwezig).map(x=>tile({...x,naam:g.type=='free'?x.naam+' (sandwich)':x.naam},'bel',full)):[];
   h+=`<h2>${TT[t]}</h2><div class="tiles">${a.concat(b).join('')}</div>`});
  else{const full=cnt(k,w,c)>=g[c];h+=`<div class="tiles">${DB.art.filter(x=>x.cat==c&&x.aantal>0).map(x=>tile(x,c,full)).join('')}</div>`}}
 const need=c=='doos'&&pk(k,w).some(p=>p.soort=='koek'&&!p.doos_id);
 return h+`<div class="row" style="margin-top:16px">${i>0?B('‹ Terug','S.step--;draw()','ghost big'):''}${need?'':B(i==st.length-1?'Klaar ✓':'Verder ›','S.step++;draw()','big')}</div>`}
function parentCard(k){return `<div class="card"><h2>Mammie en pappie</h2>${FAM.filter(f=>!f.kid).map(f=>`<div style="margin:6px 0"><span class="who" style="color:${f.c}">${f.n}</span><div>${minis(k,ALL,1,f.id)||'<span class="mute">Nog niets gekozen.</span>'}</div></div>`).join('')}${B(pk(k,S.who).length?'Mijn lijstje aanpassen':'Mijn lijstje maken','S.edit=1;S.step=0;draw()')}</div>`}
function shopCard(){return `<div class="card"><h2>Boodschappenlijstje</h2><div class="mute" style="margin-bottom:6px">Is er iets op? Schrijf het hier.</div>${DB.shop.filter(x=>x.persoon==S.who).map(x=>`<div class="row sp"><span>${x.in_kar?'✅':'⬜'} ${esc(x.tekst)}</span>${x.in_kar?'':`<button class="chip sm" onclick="delShop(${x.id})" aria-label="Verwijder">✕</button>`}</div>`).join('')}<div class="row" style="margin-top:8px"><input type="text" id="ns" placeholder="Wat is er op?"><button class="btn" onclick="addShop()">+</button></div></div>`}
function day(){if(S.edit&&(adm()||DB.dagen[S.day]))return wiz(S.day);
 const k=S.day,gc=DB.dagen[k],on=DB.ds.filter(x=>x.dag==k).map(x=>x.symbool_id);
 let h=head(nlDate(k,{weekday:'long',day:'numeric',month:'long'}),'cal')+'<div class="card"><h2>Op het programma</h2>';
 if(adm())h+=DB.sym.map(s=>`<button class="chip${on.includes(s.id)?' on':''}" onclick="tog(${s.id})">${si(s)} ${esc(s.naam)}</button>`).join('')+`<div class="row" style="margin-top:8px"><input type="text" id="ne" placeholder="🙂" style="width:64px"><input type="text" id="nn" placeholder="Nieuw symbool"><button class="btn" onclick="addSym()">+</button></div>`;
 else h+=on.length?on.map(i=>{const s=DB.sym.find(z=>z.id==i);return s?`<span class="chip">${si(s)} ${esc(s.naam)}</span>`:''}).join(''):'<span class="mute">Niets bijzonders.</span>';
 h+='</div>';
 if(adm()){
  h+=wxCard(k)+(S.cf?`<div class="card warn">Kinderen hebben hiervoor al gekozen. Hun keuzes voor dit onderdeel vervallen als je dit wijzigt.<div class="row" style="margin-top:8px">${B('Ja, wijzig','cfOk()')}${B('Annuleer','S.cf=null;draw()','ghost')}</div></div>`:'')+'<div class="card"><h2>Schoollijstje instellen</h2>';
  if(!gc)h+=B('Dag instellen','setDay()');
  else{h+=`<div class="row">${B('Boterhammen',"setT('b')",gc.type=='b'?'':'ghost')}${B('Sandwich',"setT('s')",gc.type=='s'?'':'ghost')}</div>`;
   [['hartig','Hartig beleg'],['zoet','Zoet beleg'],...SC.map(c=>[c,CATS[c]])].forEach(([f,l])=>h+=`<div class="row sp"><span>${l}</span>${stp(`chg('${f}',`,gc[f])}</div>`);
   h+=B('Standaard voor elke '+nlDate(k,{weekday:'long'}),'stdWeek()','ghost sm')}
  h+=`</div>${parentCard(k)}<div class="card"><h2>Gekozen door de kinderen</h2>${FAM.filter(c=>c.kid).map(c=>`<div style="margin:6px 0"><span class="who" style="color:${c.c}">${c.n}</span><br>${mine(k,c.id)}</div>`).join('')}</div>`}
 else{h+=wxCard(k)+'<div class="card"><h2>Schoollijstje</h2>';
  h+=gc?mine(k,S.who)+`<div style="margin-top:8px">${B(pk(k,S.who).length?'Aanpassen':'Maken','S.edit=1;S.step=0;draw()')}</div>`:'<span class="mute">Mammie en pappie hebben deze dag nog niet ingesteld.</span>';
  h+='</div>'}
 const TK=DB.taken.filter(t=>t.dag==k);
 h+=`<div class="card"><h2>Taken</h2>${TK.length?TK.map(t=>adm()?`<div style="margin:8px 0"><div class="row sp"><span>• ${esc(t.tekst)}</span><button class="chip sm" onclick="delT(${t.id})" aria-label="Verwijder">✕</button></div>${FAM.filter(c=>c.kid).map(c=>{const d=DB.klaar.some(x=>x.taak_id==t.id&&x.persoon==c.id);return `<span class="chip${d?' on':''}">${c.n}${d?' ✓':' ○'}</span>`}).join('')}</div>`:`<label class="row" style="margin:6px 0"><input type="checkbox" ${DB.klaar.some(x=>x.taak_id==t.id&&x.persoon==S.who)?'checked':''} onchange="doneT(${t.id})"> ${esc(t.tekst)}</label>`).join(''):'<span class="mute">Geen taken.</span>'}`;
 h+=adm()?`<div class="row" style="margin-top:8px"><input type="text" id="nt" placeholder="Nieuwe taak"><button class="btn" onclick="addTask()">+</button></div>`:'';
 return h+'</div>'+shopCard()}
function editCard(){const e=S.ed,o=edObj(e);let h=`<div class="card" style="border-color:var(--acc)"><h2>Aanpassen</h2><input type="text" id="en" value="${esc(o.naam)}" style="margin-bottom:8px">`;
 if(e.kind=='sym')h+=`<input type="text" id="ee" value="${esc(o.emoji)}" style="margin-bottom:8px">`;
 if(e.kind=='bel'||(e.kind=='inv'&&o.cat=='brood'))h+=`<select id="et" style="margin-bottom:8px"><option value="h"${o.soort=='h'?' selected':''}>Hartig</option><option value="z"${o.soort=='z'?' selected':''}>Zoet</option></select>`;
 if(e.kind=='inv'&&o.cat=='fruit')h+=`<input type="text" id="eq" value="${esc(o.vraag||'')}" placeholder="Extra vraag (leeg = geen)" style="margin-bottom:8px"><input type="text" id="eo" value="${esc((o.antwoorden||[]).join(', '))}" placeholder="Antwoorden, gescheiden door komma" style="margin-bottom:8px">`;
 return h+`<div class="row">${B('Opslaan','edSave()')}${B('Annuleer','S.ed=null;draw()','ghost')}${e.del?B('Zeker verwijderen','edDel()','ghost warn'):B('Verwijderen','S.ed.del=1;draw()','ghost')}</div></div>`}
const eb=(k,id)=>`<button class="chip sm" onclick="ed('${k}',${id})" aria-label="Aanpassen">✏️</button> `;
function inv(){let h=head('Voorraad')+(S.ed?editCard():'');
 Object.keys(CATS).forEach(c=>{h+=`<div class="card"><h2>${CATS[c]}</h2>${DB.art.filter(x=>x.cat==c).map(x=>`<div class="row sp"><span class="${x.aantal<=2?'warn':''}">${eb('inv',x.id)}${esc(x.naam)}${x.soort?` <button class="chip sm" onclick="flip('inv',${x.id})">${TT[x.soort]}</button>`:''}${x.vraag?' <span class="mute">+vraag</span>':''}</span>${stp(`qq(${x.id},`,x.aantal)}</div>`).join('')||'<span class="mute">Nog niets.</span>'}</div>`});
 h+=`<div class="card"><h2>Beleg in huis (sandwichen)</h2>${DB.bel.map(b=>`<div class="row sp"><span>${eb('bel',b.id)}${esc(b.naam)} <button class="chip sm" onclick="flip('bel',${b.id})">${TT[b.soort]}</button></span><button class="chip${b.aanwezig?' on':''}" onclick="bOn(${b.id})">${b.aanwezig?'Aanwezig':'Niet aanwezig'}</button></div>`).join('')}<div class="row"><input type="text" id="bn" placeholder="Nieuw beleg"><select id="bt" style="width:110px"><option value="h">Hartig</option><option value="z">Zoet</option></select><button class="btn" onclick="addBel()">+</button></div></div>`;
 h+=`<div class="card"><h2>Koekendozen</h2>${DB.doz.map(d=>`<div class="row sp"><span>${eb('doz',d.id)}${esc(d.naam)}</span>${stp(`dd(${d.id},`,d.aantal)}</div>`).join('')}<div class="row"><input type="text" id="dn" placeholder="Nieuwe doos"><button class="btn" onclick="addDoz()">+</button></div></div>`;
 h+=`<div class="card"><h2>Nieuw artikel</h2><select id="ic">${Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c]}</option>`).join('')}</select><div class="row" style="margin:6px 0"><input type="text" id="in" placeholder="Naam"><select id="it" style="width:110px"><option value="h">Hartig</option><option value="z">Zoet</option></select></div><input type="text" id="iq" placeholder="Fruit: extra vraag (optioneel)" style="margin-bottom:6px"><input type="text" id="io" placeholder="Antwoorden, gescheiden door komma"><div style="margin-top:8px">${B('Toevoegen','addInv()')}</div><div class="mute" style="margin-top:6px">Hartig/zoet geldt enkel voor boterhammen.</div></div>`;
 h+=`<div class="card"><h2>Symbolen</h2>${DB.sym.map(s=>`<div class="row sp"><span>${eb('sym',s.id)}${si(s)} ${esc(s.naam)}</span></div>`).join('')||'<span class="mute">Nog geen symbolen. Voeg ze toe bij een dag.</span>'}</div>`;
 return h+`<div class="card"><h2>Code voor mammie en pappie</h2><div class="row"><input type="text" id="np" inputmode="numeric" maxlength="4" placeholder="Nieuwe code (4 cijfers)"><button class="btn" onclick="setPin()">Opslaan</button></div></div>`}
function shop(){let h=head('Boodschappen')+`<div class="card"><h2>Op mijn lijstje zetten</h2><div class="row"><input type="text" id="ns" placeholder="Wat moet er gekocht worden?"><button class="btn" onclick="addShop()">+</button></div></div><div class="mute" style="margin-bottom:10px">Tik één keer: in het karretje. Tik nog eens na het afrekenen: weg van het lijstje.</div>`;
 FAM.forEach(f=>{const L=DB.shop.filter(x=>x.persoon==f.id);h+=`<div class="card"><div class="who" style="color:${f.c};margin-bottom:6px">${f.n}</div>${L.length?L.map(x=>`<button class="it${x.in_kar?' done':''}" onclick="tapShop(${x.id})"><span>${x.in_kar?'✅':'⬜'}</span>${esc(x.tekst)}</button>`).join(''):'<span class="mute">Niets op het lijstje.</span>'}</div>`});
 return h}
/* ---------- weer ---------- */
let WP=[];const WX={},HOME_PLACE={naam:'Ruisbroek',lat:51.09,lon:4.31};
const todayK=()=>{const t=new Date();return key(t.getFullYear(),t.getMonth(),t.getDate())};
const wmo=c=>c==0?['☀️','Onbewolkt']:c<=1?['🌤️','Overwegend zonnig']:c==2?['⛅','Half bewolkt']:c==3?['☁️','Bewolkt']:c<=48?['🌫️','Mist']:c<=57?['🌦️','Motregen']:c<=67?['🌧️','Regen']:c<=77?['🌨️','Sneeuw']:c<=82?['🌦️','Buien']:c<=86?['🌨️','Sneeuwbuien']:['⛈️','Onweer'];
const wxPlace=k=>WP.find(p=>p.van<=k&&k<=p.tot)||HOME_PLACE;
function wxGet(p){const id=p.lat+','+p.lon,w=WX[id];if(w&&Date.now()-w.t<1800000)return w;
 WX[id]={t:Date.now(),s:'laden'};
 fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FBrussels&forecast_days=16`).then(r=>r.json()).then(j=>{WX[id]={t:Date.now(),s:'ok',d:j.daily};draw()}).catch(()=>{WX[id]={t:Date.now(),s:'fout'};draw()});
 return WX[id]}
async function addWP(){const n=gv('wn'),v=document.getElementById('wv').value,t=document.getElementById('wt').value;
 if(!n||!v||!t){toast('Vul de plaats en beide data in.');return}if(t<v){toast('De einddatum ligt voor de begindatum.');return}
 try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(n)+'&count=1&language=nl'),j=await r.json(),g=j.results&&j.results[0];
  if(!g){toast('Plaats niet gevonden.');return}await act(()=>ins('weerplaatsen',{van:v,tot:t,naam:g.name,lat:g.latitude,lon:g.longitude}))}catch(e){toast('Plaats zoeken lukte niet.')}}
const delWP=id=>act(()=>del('weerplaatsen',{id}));
function wxCard(k){const p=wxPlace(k),w=wxGet(p);let b;
 if(w.s=='laden')b='<span class="mute">Weer laden…</span>';
 else if(w.s=='fout')b='<span class="mute">Weerbericht niet beschikbaar.</span>';
 else{const i=w.d.time.indexOf(k);
  if(i<0)b='<span class="mute">Nog geen voorspelling voor deze dag.</span>';
  else{const[e,t]=wmo(w.d.weather_code[i]),r=w.d.precipitation_probability_max[i];
   b=`<div class="row" style="gap:14px"><span style="font-size:52px;line-height:1">${e}</span><div><div class="who">${t}</div><div>${Math.round(w.d.temperature_2m_min[i])}° tot ${Math.round(w.d.temperature_2m_max[i])}°</div><div class="mute">${r==null?'':r+'% kans op regen · '}wind tot ${Math.round(w.d.wind_speed_10m_max[i])} km/u</div></div></div>`}}
 let a='';
 if(adm())a=`<div style="margin-top:12px;border-top:2px solid var(--line);padding-top:10px"><div class="who">Weer van een andere plaats</div>${WP.filter(x=>x.tot>=todayK()).map(x=>`<div class="row sp"><span>${esc(x.naam)}: ${nlDate(x.van,{day:'numeric',month:'short'})} – ${nlDate(x.tot,{day:'numeric',month:'short'})}</span><button class="chip sm" onclick="delWP(${x.id})" aria-label="Verwijder">✕</button></div>`).join('')}<input type="text" id="wn" placeholder="Plaats (bv. De Panne)" style="margin:6px 0"><div class="row"><input type="date" id="wv" value="${k}" aria-label="Van"><input type="date" id="wt" value="${k}" aria-label="Tot"><button class="btn" onclick="addWP()">+</button></div></div>`;
 return `<div class="card"><h2>Weer · ${esc(p.naam)}</h2>${b}${a}</div>`}
/* ---------- tekenen + terugknop ---------- */
let POP=0,LS='';
addEventListener('popstate',e=>{let t=e.state||{scr:'home'};if(t.scr!='home'&&!S.who||t.scr=='pin')t={scr:'home'};S.scr=t.scr;S.day=t.day||S.day;S.edit=t.edit||0;S.step=t.step||0;S.pend=null;S.cf=null;S.ed=null;POP=1;draw();POP=0});
function draw(){const a=document.getElementById('app'),vals={};a.querySelectorAll('input[type=text]').forEach(i=>{if(i.id&&i.value)vals[i.id]=i.value});
 const f={home,pin:pinS,cal,day,inv,shop};
 a.innerHTML=(S.err?`<div class="card warn">${S.err}</div>`:'')+(S.toast?`<div class="card">${esc(S.toast)}</div>`:'')+(S.loading?'<div class="mute">Laden…</div>':f[S.scr]());
 for(const id in vals){const e=document.getElementById(id);if(e&&!e.value)e.value=vals[id]}
 const s=S.scr+S.day+S.edit+S.step+(S.pend?1:0)+(S.ed?'e':'');
 if(s!=LS){scrollTo(0,0);if(!POP)try{history[LS?'pushState':'replaceState']({scr:S.scr,day:S.day,edit:S.edit,step:S.step},'')}catch(e){}LS=s}}
draw();load();
</script></body></html>
